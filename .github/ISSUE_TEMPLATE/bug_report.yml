name: Reporte de error
description: Algo no funciona como se espera.
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: ¿Qué ocurrió y qué esperabas que ocurriera?
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Ejecuto d!...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
  - type: textarea
    id: logs
    attributes:
      label: Registros relevantes
      description: Elimina cualquier token, clave o dato personal antes de pegarlos.
      render: shell
